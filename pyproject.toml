[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tekb-core"
version = "0.2.0"
description = "Shared TEKB SAMSON research engine (Phase 1 — Foundation)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
]

[tool.setuptools.packages.find]
include = ["tekb_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
